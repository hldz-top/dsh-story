# Apply with `dsh --patch` after the Story plugin is mounted, only for a newly authorized run.
#
# DSH does not merge `config:` blocks key by key: this entry's `config:` REPLACES the whole config that earlier layers
# (the bundle and your profile's cordis.patch.yml) gave `dsh-story-weaver`. Every key you leave out falls back to the
# plugin default. This example lists 9 common keys (the schema has 19); any other schema key you set in your own config must be copied in
# too, or it falls back to its default (the schema is Config in
# https://github.com/hldz-top/dsh-story/blob/v0.1.0-rc.1/src/index.ts), including operator switches such as
# allowIncompleteSettings or allowSettingsImport. The values below are the plugin defaults except maxResearchSources
# (default 24, raised to 96). Check the result with `dsh --profile <profile> --patch <this file> --dump-config`.
#
# A run freezes the limits it started with. Resuming it later is refused ("Restore the captured writing and research
# limits…") unless maxArtifactBytes, maxReadChars, the five research limits (maxResearchQuestions, maxResearchCalls,
# maxResearchSources, maxEvidenceChars, maxResearchLogEvents) and min/maxChapterWords match the run's captured values,
# so resume with this same patch.
#
# The entry id is the plugin id `dsh-story-weaver` (renamed from `dsh-story`). A patch with the old id is skipped at
# runtime without an error; only `--dump-config` prints `patch: entry "dsh-story" not found` on stderr.
- id: dsh-story-weaver
  config:
    stageProvider: spawn
    minChapterWords: 3000
    maxChapterWords: 5000
    maxParallelStages: 3
    maxRepairAttempts: 2
    maxRunAttempts: 512
    stageTimeoutMs: 600000
    maxResearchCalls: 12
    maxResearchSources: 96
    # allowIncompleteSettings: true   # only if your profile already sets it
